name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.12"
            tox-env: "py312"
          - python-version: "3.13"
            tox-env: "py313"
          - python-version: "3.14"
            tox-env: "py314"
            continue-on-error: true
          - python-version: "3.15"
            tox-env: "py315"
            continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install --preview ${{ matrix.python-version }}

    - name: Install System Dependencies for source builds
      run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev

    - name: Install dependencies
      continue-on-error: ${{ matrix.continue-on-error || false }}
      run: PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 uv sync --all-extras --dev --python ${{ matrix.python-version }}

    - name: Run checks via tox
      continue-on-error: ${{ matrix.continue-on-error || false }}
      run: uv run tox -e ${{ matrix.tox-env }}
